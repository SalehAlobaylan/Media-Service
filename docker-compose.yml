services:
  media-api: &media-api
    build: .
    container_name: wahb-media-api
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "5051"]
    environment: &media-environment
      ENV: development
      PORT: "5051"
      MEDIA_ROLE: api
      CMS_BASE_URL: http://host.docker.internal:8080
      CMS_SERVICE_TOKEN: dev-service-token
      MEDIA_SERVICE_TOKEN: dev-media-token
      CMS_MEDIA_SERVICE_TOKEN: dev-service-token
      REDIS_URL: redis://host.docker.internal:6380
      ARQ_REDIS_DB: "2"
      MEDIA_TEMP_DIR: /tmp/wahb-media
    ports:
      - "5051:5051"
    tmpfs:
      - /tmp/wahb-media:rw,size=2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5051/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  media-worker:
    <<: *media-api
    container_name: wahb-media-worker
    command: ["python", "-m", "arq", "src.worker.WorkerSettings"]
    environment:
      <<: *media-environment
      MEDIA_ROLE: worker
      MEDIA_API_BASE_URL: http://media-api:5051
    ports: []
    tmpfs:
      - /tmp/wahb-media:rw,size=8g
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://media-api:5051/health/queue', timeout=5)); assert d['reachable'] and d['worker_alive']"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      media-api:
        condition: service_healthy
    restart: unless-stopped
