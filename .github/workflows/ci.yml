name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Create the sole test environment
        run: python -m venv .venv
      - name: Install dev deps
        run: make install-dev
      - name: Lint
        run: make lint
      - name: Full contract suite with source-aware branch coverage
        run: make test-coverage
